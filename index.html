<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Influencer Gear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
  <script src="https://kit.fontawesome.com/ed516ed1f4.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="header poppins">
    <nav class="nav-bar display-flex primary-color ">
      <p class="brand">
        Influencer products
      </p>
      <ul class="nav-links display-flex">
        <li class="nav-item">
          <a href="" class="nav-link">
            Home
          </a>
        </li>
        <li class="nav-item">
          <a href="" class="nav-link">
            Products
          </a>
        </li>
        <li class="nav-item">
          <a href="" class="nav-link">
            Sign up
          </a>
        </li>
        <li class="nav-item">
          <a href="" class="nav-link">
            Log In
          </a>
        </li>
        <li class="nav-item">
          <a href="" class="nav-link">
            <i class="fa-solid fa-magnifying-glass" style="color: rgb(21, 21, 21);"></i>
          </a>
        </li>
        <li class="nav-item">
          <a href="" class="nav-link">
            <i class="fa-solid fa-cart-shopping" style="color: rgb(21, 21, 21);"></i>
          </a>
        </li>
      </ul>
    </nav>
    <!-- Journey Section -->
    <section class="journey ">
      <div class="journey-container display-flex">
        <div class="journey-content">
          <h3 class="journey-title primary-color">
            Start your Journey as 
            Influencer
          </h3>
          <p class="journey-description primary-color">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sem vestibulum sed scelerisque eros. Lectus faucibus.
          </p>
          <button class="book-btn btn">
            Prebook now
            <i id="arrow" class="fa-solid fa-arrow-right" style="color: rgb(239, 228, 228);"></i>
          </button>
        </div>
        <div class="header-img">
          <img src="images/Circle design.svg" alt="" class="camera-bg">
          <img src="images/main-camera.png" alt="" class="main-camera">
        </div>
      </div>
    </section>
  </header>
  <!-- Main Start -->
  <main>
    <section class="e-commerce-container">
      <div class="e-commerce-img-container">
        <a href="https://www.alibaba.com/" class="e-commerce-link" target="_blank">
          <img src="logos/Alibaba.svg" alt="" class="e-commerce-img"></a>
          <a href="https://www.amazon.com/" class="e-commerce-link">
            <img src="logos/Amazon.svg" alt="" class="e-commerce-img">
          </a>
            <a href="https://www.daraz.com.bd/" class="e-commerce-link">
              <img src="logos/Daraz.pk Logo.svg" alt="" class="e-commerce-img">
            </a>
              <a href="https://www.ebay.com/str/dhakastore" class="e-commerce-link">
                <img src="logos/Ebay.svg" alt="" class="e-commerce-img">
              </a>
              <a href="https://www.rakuten.com/" class="e-commerce-link">
                <img src="logos/Rakuten.svg" alt="" class="e-commerce-img">
              </a>
              <a href="https://www.walmart.com/" class="e-commerce-link">
                <img src="logos/Walmart.svg" alt="" class="e-commerce-img">
              </a>
              <a href="https://www.target.com/" class="e-commerce-link">
                <img src="logos/Target.svg" alt="" class="e-commerce-img">
              </a>
      </div>
    </section>
  </main>
</body>
</html>
